<!DOCTYPE html>
<html>
<head>
<title>Ordonnancement tableau</title>

<style>

body {
    font-family: Arial;
    background: #efefef;
    margin: 0;
    padding: 20px;
    position: relative;
}

/* HEADER */
.header {
    text-align: right;
    font-weight: bold;
    font-size: 18px;
}

/* CARD */
.card {
    background: #e6e6e6;
    padding: 20px;
    margin-top: 20px;
    border-radius: 10px;
}

/* INPUT */
input {
    display: block;
    margin: 10px 0;
    padding: 8px;
    width: 200px;
}

/* BUTTON */
button {
    padding: 10px 20px;
    background: #ccc;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

/* TABLE STYLE (ligne horizontale) */
.matrix {
    display: grid;
    gap: 5px;
    margin-top: 10px;
}

.cell {
    background: #d9d9d9;
    padding: 8px;
    text-align: center;
    border-radius: 4px;
    border: 1px solid #bbb;
}

/* STEP */
.step {
    font-size: 14px;
    margin-bottom: 10px;
}

/* NOTIF */
.notif {
    position: absolute;
    top: 50px;
    right: 20px;
    background: #ccc;
    padding: 10px;
    border-radius: 5px;
}

.next-btn {
    position: absolute;
    top: 255px; /* AVANT 100px → maintenant plus bas */
    right: 20px;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: #ccc;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
}

/* FLOW (chemin critique) */
.flow {
    display: flex;
    align-items: center;
    gap: 10px;
}

.circle {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: #ccc;
    display: flex;
    align-items: center;
    justify-content: center;
}

.arrow {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.duration {
    font-size: 12px;
}

.hidden {
    display: none;
}

.block {
    display: inline-block;
    margin: 10px;
}

.block table {
    border-collapse: collapse;
}

.block td {
    border: 1px solid black;
    padding: 6px 10px;
    text-align: center;
}

.top-row {
    border-bottom: 1px solid black;
}

.split {
    border-left: 1px solid black;
}

.critical-bold {
    color: red;
    font-weight: bold;
}

.latest-bold {
    color: blue;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="header">ORDONNANCEMENT TABLEAU</div>

<!-- ================= PAGE 1 ================= -->
<div id="page1">

<div class="card">

<div class="step">Etape 1</div>
<h3>Ajouter une tâche</h3>

<input id="nom" placeholder="Nom">
<input id="duree" placeholder="Durée">
<input id="dependances" placeholder="Tâches antérieures (A,B)">

<button onclick="addTask()">Ajouter</button>

<div class="notif hidden" id="notif">✔ Calcul effectué</div>
<div class="next-btn hidden" id="nextBtn" onclick="goRealPage2()">➤</div>
</div>

<div class="card">

<h3>Liste des tâches</h3>

<div id="matrix" class="matrix hidden"></div>

</div>

<button onclick="goToPage2()">Calculer</button>
<button onclick="showMatrix()">Afficher liste des tâches</button>

</div>

<!-- ================= PAGE 2 ================= -->
<div id="page2" class="hidden">
<button onclick="goBack()">← Retour</button>
<!-- ETAPE 2 -->
<div class="card">
<div class="step">Etape 2</div>
<h3>Dates au plus tôt</h3>
<div id="earliest"></div>
</div>

<!-- ETAPE 3 -->
<div class="card">
<div class="step">Etape 3</div>
<h3>Chemin critique</h3>
<div id="critical"></div> <!-- tableaux -->
<div id="criticalFlow" class="flow"></div> <!-- graphe -->
</div>

<!-- ETAPE 4 -->
<div class="card">
<div class="step">Etape 4</div>
<h3>Dates au plus tard</h3>
<div id="latest"></div>
</div>

</div>

<script>

const API = "http://127.0.0.1:8000"


function showMatrix(){
    const matrix = document.getElementById("matrix")
    matrix.classList.remove("hidden")
    loadMatrix()
}

// ================= ADD =================
async function addTask(){

    const nom = document.getElementById("nom").value.trim()
    const duree = parseInt(document.getElementById("duree").value)

    if(!nom || isNaN(duree)){
        alert("Remplir nom et durée correctement")
        return
    }

    const res = await fetch(API + "/tasks")
    const data = await res.json()

    const depNames = document.getElementById("dependances").value
        .split(",")
        .map(x=>x.trim())
        .filter(x=>x)

    const dependances = depNames.map(name => {
        const t = data.find(x => x.nom === name)
        return t ? t.id : null
    }).filter(x=>x)

    const task = {
        id: Date.now(),
        nom: nom,
        duree: duree,
        date_plus_tot:0,
        date_plus_tard:0,
        marge:0,
        dependances:dependances
    }

    await fetch(API+"/tasks",{
        method:"POST",
        body:JSON.stringify(task),
        headers:{"Content-Type":"application/json"}
    })

    // reset inputs
    document.getElementById("nom").value = ""
    document.getElementById("duree").value = ""
    document.getElementById("dependances").value = ""

    loadMatrix()
}

// ================= MATRIX =================
async function loadMatrix(){

    const res = await fetch(API+"/tasks")
    const tasks = await res.json()

    const matrix = document.getElementById("matrix")
    matrix.innerHTML=""

    let successorsMap = {}
    tasks.forEach(t=>successorsMap[t.nom]=[])

    tasks.forEach(t=>{
        t.dependances.forEach(dep=>{
            const parent = tasks.find(x=>x.id===dep)
            if(parent) successorsMap[parent.nom].push(t.nom)
        })
    })

    const nbCols = tasks.length + 1

    // 🔥 définir colonnes FIXES
    matrix.style.gridTemplateColumns = `180px repeat(${tasks.length}, 1fr)`

    // 🔥 ligne 1 : Tâche
    matrix.innerHTML += `<div class="cell"><b>Tâche</b></div>`
    tasks.forEach(t=>{
        matrix.innerHTML += `<div class="cell">${t.nom}</div>`
    })

    // 🔥 ligne 2 : Durée
    matrix.innerHTML += `<div class="cell"><b>Durée</b></div>`
    tasks.forEach(t=>{
        matrix.innerHTML += `<div class="cell">${t.duree}</div>`
    })

    // 🔥 ligne 3 : Antérieures
    matrix.innerHTML += `<div class="cell"><b>Tâches antérieures</b></div>`
    tasks.forEach(t=>{
        const val = t.dependances.map(d=>tasks.find(x=>x.id===d)?.nom).join(",") || "-"
        matrix.innerHTML += `<div class="cell">${val}</div>`
    })

    // 🔥 ligne 4 : Successeurs
    matrix.innerHTML += `<div class="cell"><b>Tâches successeurs</b></div>`
    tasks.forEach(t=>{
        const val = successorsMap[t.nom].join(",") || "FIN"
        matrix.innerHTML += `<div class="cell">${val}</div>`
    })
}

// ================= NAVIGATION =================
function goToPage2(){
    document.getElementById("notif").classList.remove("hidden")
    document.getElementById("nextBtn").classList.remove("hidden")
}
function goRealPage2(){
    document.getElementById("page1").classList.add("hidden")
    document.getElementById("page2").classList.remove("hidden")

    loadEarliest()
    loadCritical()
    loadLatest()
}

function goBack(){
    document.getElementById("page2").classList.add("hidden")
    document.getElementById("page1").classList.remove("hidden")
}

// ================= EARLIEST =================
async function loadEarliest(){

    await fetch(API + "/schedule/earliest")

    const res = await fetch(API + "/tasks")
    const tasks = await res.json()

    const container = document.getElementById("earliest")
    container.innerHTML = ""

    const tasksWithSuccessors = tasks.flatMap(t => t.dependances)
    const lastTasks = tasks.filter(t => !tasksWithSuccessors.includes(t.id))

    tasks.forEach(task => {

        const block = document.createElement("div")
        block.className = "block"

        let html = `<table>`

        html += `
        <tr class="top-row">
            <td colspan="2">
                <span style="color:red">${task.date_plus_tot}</span> ${task.nom}
            </td>
        </tr>`

        if(task.dependances.length === 0){
            html += `
            <tr>
                <td style="color:red">0</td>
                <td class="split">DEBUT 0</td>
            </tr>`
        } else {
            task.dependances.forEach(dep => {
                const parent = tasks.find(t => t.id === dep)
                html += `
                <tr>
                    <td style="color:red">${parent.date_plus_tot}</td>
                    <td class="split">${parent.nom} ${parent.duree}</td>
                </tr>`
            })
        }

        html += `</table>`

        block.innerHTML = html
        container.appendChild(block)
    })

    // ===== FIN =====
    const endBlock = document.createElement("div")
    endBlock.className = "block"

    let maxEnd = 0

    lastTasks.forEach(t => {
        const val = t.date_plus_tot + t.duree
        if(val > maxEnd) maxEnd = val
    })

    let endHTML = `<table>
        <tr class="top-row">
            <td colspan="2">
                <span style="color:red">${maxEnd}</span> FIN
            </td>
        </tr>`

    lastTasks.forEach(t => {
        endHTML += `
        <tr>
            <td style="color:red">${t.date_plus_tot}</td>
            <td class="split">${t.nom} ${t.duree}</td>
        </tr>`
    })

    endHTML += `</table>`

    endBlock.innerHTML = endHTML
    container.appendChild(endBlock)
}

// ================= CRITICAL FLOW =================
function getCriticalParents(tasks){

    const map = {}

    tasks.forEach(task => {

        if(task.dependances.length === 0){
            map[task.nom] = "DEBUT"
        } else {

            let maxVal = -1
            let bestParent = null

            task.dependances.forEach(dep => {

                const parent = tasks.find(t => t.id === dep)

                if(parent){
                    const val = parent.date_plus_tot + parent.duree

                    if(val > maxVal){
                        maxVal = val
                        bestParent = parent.nom
                    }
                }
            })

            map[task.nom] = bestParent
        }
    })

    return map
}

async function loadCritical(){

    await fetch(API + "/schedule/earliest")

    const res = await fetch(API + "/tasks")
    const tasks = await res.json()

    const container = document.getElementById("critical")
    const flow = document.getElementById("criticalFlow")

    if(!container || !flow) return

    container.innerHTML = ""
    flow.innerHTML = ""

    // ================= SUCCESSEURS =================
    let successorsMap = {}
    tasks.forEach(t => successorsMap[t.nom] = [])

    tasks.forEach(task => {
        task.dependances.forEach(dep => {
            const parent = tasks.find(t => t.id === dep)
            if(parent){
                successorsMap[parent.nom].push(task)
            }
        })
    })

    // ================= FIN =================
    const tasksWithSuccessors = tasks.flatMap(t => t.dependances)
    const lastTasks = tasks.filter(t => !tasksWithSuccessors.includes(t.id))

    let maxEnd = 0
    let bestLast = null

    lastTasks.forEach(t => {
        const val = t.date_plus_tot + t.duree
        if(val > maxEnd){
            maxEnd = val
            bestLast = t
        }
    })

    // ================= REMONTÉE CRITIQUE =================
    let criticalLinks = {}

    let current = bestLast

    while(current){

        if(current.dependances.length === 0){
            criticalLinks[current.nom] = "DEBUT"
            break
        }

        let maxVal = -1
        let bestParent = null

        current.dependances.forEach(dep => {
            const parent = tasks.find(t => t.id === dep)
            const val = parent.date_plus_tot + parent.duree

            if(val > maxVal){
                maxVal = val
                bestParent = parent
            }
        })

        criticalLinks[current.nom] = bestParent.nom
        current = bestParent
    }

    // ================= TABLEAUX TÂCHES =================
    tasks.forEach(task => {

        const block = document.createElement("div")
        block.className = "block"

        let html = `<table>`

        html += `
        <tr class="top-row">
            <td colspan="2">
                <span style="color:red">${task.date_plus_tot}</span> ${task.nom}
            </td>
        </tr>`

        if(task.dependances.length === 0){

            const isCritical = criticalLinks[task.nom] === "DEBUT"

            html += `
            <tr>
                <td class="${isCritical ? 'critical-bold' : ''}" style="color:red">0</td>
                <td class="split ${isCritical ? 'critical-bold' : ''}">
                    DEBUT 0
                </td>
            </tr>`

        } else {

            task.dependances.forEach(dep => {

                const parent = tasks.find(t => t.id === dep)

                const isCritical =
                    criticalLinks[task.nom] === parent.nom

                html += `
                <tr>
                    <td class="${isCritical ? 'critical-bold' : ''}" style="color:red">
                        ${parent.date_plus_tot}
                    </td>
                    <td class="split ${isCritical ? 'critical-bold' : ''}">
                        ${parent.nom} ${parent.duree}
                    </td>
                </tr>`
            })
        }

        html += `</table>`

        block.innerHTML = html
        container.appendChild(block)
    })

    // ================= 🔴 TABLEAU FIN =================
    const endBlock = document.createElement("div")
    endBlock.className = "block"

    let endHTML = `<table>
        <tr class="top-row">
            <td colspan="2">
                <span style="color:red">${maxEnd}</span> FIN
            </td>
        </tr>`

    lastTasks.forEach(t => {

        const isCritical = (t.nom === bestLast.nom)

        endHTML += `
        <tr>
            <td class="${isCritical ? 'critical-bold' : ''}" style="color:red">
                ${t.date_plus_tot}
            </td>
            <td class="split ${isCritical ? 'critical-bold' : ''}">
                ${t.nom} ${t.duree}
            </td>
        </tr>`
    })

    endHTML += `</table>`

    endBlock.innerHTML = endHTML
    container.appendChild(endBlock)

    // ================= 🔴 GRAPHE =================
    let path = []
    let node = bestLast

    while(node){
        path.unshift(node)
        const parentName = criticalLinks[node.nom]
        if(parentName === "DEBUT") break
        node = tasks.find(t => t.nom === parentName)
    }

    // 🔴 DEBUT
    flow.innerHTML = `
        <div class="circle">DEBUT</div>
        <div class="arrow">
            <div class="duration">0</div>
            →
        </div>
    `

    // 🔴 chemin
    path.forEach((t,i) => {

        flow.innerHTML += `<div class="circle">${t.nom}</div>`

        // durée = tâche actuelle (sauf FIN)
        flow.innerHTML += `
        <div class="arrow">
            <div class="duration">${t.duree}</div>
            →
        </div>`
    })

    // 🔴 FIN
    flow.innerHTML += `<div class="circle">FIN</div>`
}
async function loadLatest(){

    await fetch(API + "/schedule/earliest")
    await fetch(API + "/schedule/latest")

    const res = await fetch(API + "/tasks")
    const tasks = await res.json()

    const container = document.getElementById("latest")
    container.innerHTML = ""

    // 🔥 construire successeurs
    let successorsMap = {}
    tasks.forEach(t => successorsMap[t.nom] = [])

    tasks.forEach(task => {
        task.dependances.forEach(dep => {
            const parent = tasks.find(t => t.id === dep)
            if(parent){
                successorsMap[parent.nom].push(task)
            }
        })
    })

    // 🔥 trouver FIN
    const tasksWithSuccessors = tasks.flatMap(t => t.dependances)
    const lastTasks = tasks.filter(t => !tasksWithSuccessors.includes(t.id))

    let maxEnd = 0
    lastTasks.forEach(t => {
        const val = t.date_plus_tot + t.duree
        if(val > maxEnd){
            maxEnd = val
        }
    })

    // ================= 🔵 DEBUT =================
    const startBlock = document.createElement("div")
    startBlock.className = "block"

    let startHTML = `<table>`

    startHTML += `
        <tr class="top-row">
            <td colspan="2">
                <span class="latest-bold">0</span> DEBUT
            </td>
        </tr>
    `

    const startTasks = tasks.filter(t => t.dependances.length === 0)

    startTasks.forEach(t => {
        startHTML += `
            <tr>
                <td class="latest-bold">${t.date_plus_tard}</td>
                <td class="split">${t.nom} 0</td>
            </tr>
        `
    })

    startHTML += `</table>`

    startBlock.innerHTML = startHTML
    container.appendChild(startBlock)

    // ================= 🔵 AUTRES =================
    tasks.forEach(task => {

        const block = document.createElement("div")
        block.className = "block"

        let html = `<table>`

        html += `
        <tr class="top-row">
            <td colspan="2">
                <span class="latest-bold">${task.date_plus_tard}</span> ${task.nom}
            </td>
        </tr>`

        const successors = successorsMap[task.nom]

        if(successors.length === 0){

            html += `
            <tr>
                <td class="latest-bold">${maxEnd}</td>
                <td class="split">FIN ${task.duree}</td>
            </tr>`

        } else {

            successors.forEach(s => {
                html += `
                <tr>
                    <td class="latest-bold">${s.date_plus_tard}</td>
                    <td class="split">${s.nom} ${task.duree}</td>
                </tr>`
            })
        }

        html += `</table>`

        block.innerHTML = html
        container.appendChild(block)
    })
}

</script>

</body>
</html>
